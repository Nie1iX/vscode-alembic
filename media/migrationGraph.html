<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src __CSP_SOURCE__ data:; style-src 'unsafe-inline' __CSP_SOURCE__; script-src 'nonce-__NONCE__' __CSP_SOURCE__;">
  <title>Migration Graph</title>
  <script nonce="__NONCE__" src="__VIS_JS__"></script>
  <style>
    body {
      font-family: var(--vscode-font-family);
      color: var(--vscode-foreground);
      background-color: var(--vscode-editor-background);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .toolbar {
      padding: 10px;
      background-color: var(--vscode-panel-background);
      border-bottom: 1px solid var(--vscode-panel-border);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toolbar button {
      background-color: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border: none;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
    }

    .toolbar button:hover {
      background-color: var(--vscode-button-hoverBackground);
    }

    #graph {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .legend {
      position: absolute;
      top: 50px;
      right: 10px;
      background-color: var(--vscode-panel-background);
      border: 1px solid var(--vscode-panel-border);
      padding: 10px;
      border-radius: 3px;
      font-size: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .no-data {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      color: var(--vscode-descriptionForeground);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="refreshButton" type="button">Refresh</button>
    <button id="fitButton" type="button">Fit to Screen</button>
    <button id="upgradeHeadButton" type="button">Upgrade to Head</button>
    <button id="upgradeButton" type="button" disabled>Upgrade to selected</button>
    <button id="downgradeButton" type="button" disabled>Downgrade to selected</button>
    <button id="mergeButton" type="button" disabled>Merge from selected</button>
    <span id="status">Loading...</span>
  </div>

  <div id="graph"></div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background-color: #4CAF50;"></div>
      <span>Current</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #2196F3;"></div>
      <span>Applied</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background-color: #FFC107;"></div>
      <span>Pending</span>
    </div>
  </div>

  <script nonce="__NONCE__">
    const vscode = acquireVsCodeApi();
    let network = null;
    let currentNode = null;

    // Network options
    const options = {
      layout: {
        hierarchical: {
          direction: 'DU',
          sortMethod: 'directed',
          nodeSpacing: 100,
          levelSeparation: 150,
          shakeTowards: 'leaves'  // Стабилизирует позиции
        }
      },
      physics: {
        enabled: false  // Отключили физику для производительности
      },
      nodes: {
        shape: 'box',
        margin: 10,
        font: {
          color: 'white',
          size: 14
        },
        borderWidth: 2,
        shadow: false  // Убрали тени для более плоского вида как в git log
      },
      edges: {
        color: 'var(--vscode-foreground)',
        width: 2,
        arrows: {
          to: {
            enabled: true,
            scaleFactor: 1
          }
        },
        smooth: false  // Прямые линии как в git log
      },
      interaction: {
        dragNodes: false,  // Убрали перетаскивание узлов
        dragView: true,
        zoomView: true
      }
    };

    function initNetwork() {
      const container = document.getElementById('graph');
      const data = { nodes: [], edges: [] };
      network = new vis.Network(container, data, options);

      // Handle node selection & actions
      network.on('selectNode', function(params) {
        currentNode = params.nodes[0] || null;
        updateActionButtons();
      });

      network.on('deselectNode', function() {
        currentNode = null;
        updateActionButtons();
      });
    }

    function updateGraph(graphData) {
      if (!network) {
        initNetwork();
      }

      if (!graphData || (!graphData.nodes.length && !graphData.edges.length)) {
        document.getElementById('status').textContent = 'No data';
        network.setData({ nodes: [], edges: [] });
        currentNode = null;
        updateActionButtons();
        return;
      }

      const nodes = new vis.DataSet(graphData.nodes);
      const edges = new vis.DataSet(graphData.edges);

      network.setData({ nodes, edges });

      // Fit network to view
      setTimeout(() => {
        network.fit();
      }, 100);

      document.getElementById('status').textContent = `${graphData.nodes.length} migrations`;
      currentNode = null;
      updateActionButtons();
    }

    function refreshGraph() {
      document.getElementById('status').textContent = 'Refreshing...';
      vscode.postMessage({ command: 'refresh' });
    }

    function upgradeHead() {
      document.getElementById('status').textContent = 'Upgrading to head...';
      vscode.postMessage({ command: 'upgradeHead' });
    }

    function upgradeSelected() {
      if (currentNode) {
        document.getElementById('status').textContent = `Upgrading to ${currentNode}...`;
        vscode.postMessage({ command: 'upgrade', id: currentNode });
      } else {
        document.getElementById('status').textContent = 'Select a migration first';
      }
    }

    function downgradeSelected() {
      if (currentNode) {
        document.getElementById('status').textContent = `Downgrading to ${currentNode}...`;
        vscode.postMessage({ command: 'downgrade', id: currentNode });
      } else {
        document.getElementById('status').textContent = 'Select a migration first';
      }
    }

    function mergeSelected() {
      if (currentNode) {
        document.getElementById('status').textContent = `Merging from ${currentNode}...`;
        vscode.postMessage({ command: 'merge', id: currentNode });
      } else {
        document.getElementById('status').textContent = 'Select a migration first';
      }
    }

    function fitNetwork() {
      if (network) {
        network.fit();
      }
    }

    function updateActionButtons() {
      const hasSelection = Boolean(currentNode);
      document.getElementById('upgradeButton').disabled = !hasSelection;
      document.getElementById('downgradeButton').disabled = !hasSelection;
      document.getElementById('mergeButton').disabled = !hasSelection;
    }

    function bindToolbar() {
      document.getElementById('refreshButton').addEventListener('click', refreshGraph);
      document.getElementById('fitButton').addEventListener('click', fitNetwork);
      document.getElementById('upgradeHeadButton').addEventListener('click', upgradeHead);
      document.getElementById('upgradeButton').addEventListener('click', upgradeSelected);
      document.getElementById('downgradeButton').addEventListener('click', downgradeSelected);
      document.getElementById('mergeButton').addEventListener('click', mergeSelected);
      updateActionButtons();
    }

    // Handle messages from extension
    window.addEventListener('message', event => {
      const message = event.data;
      switch (message.command) {
        case 'updateGraph':
          updateGraph(message.data);
          break;
        case 'error':
          document.getElementById('status').textContent = message.message || 'Command failed';
          break;
      }
    });

    // Initialize
    bindToolbar();
    initNetwork();
    vscode.postMessage({ command: 'ready' });
  </script>
</body>
</html>
